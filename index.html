<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Road Map - Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Page Container -->
    <div class="login-container">
        <div class="login-box">
            <!-- Website Logo/Title -->
            <div class="login-header">
                <h1 class="site-title">📚 Course Road Map</h1>
                <p class="site-subtitle">Your Learning Journey Starts Here</p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <!-- Student Name Input -->
                <div class="form-group">
                    <label for="studentName">Student Name:</label>
                    <input 
                        type="text" 
                        id="studentName" 
                        placeholder="Enter your full name" 
                        required
                    >
                    <span class="error-message" id="nameError"></span>
                </div>

                <!-- Year Selection -->
                <div class="form-group">
                    <label for="year">Year:</label>
                    <select id="year" required>
                        <option value="">-- Select Year --</option>
                        <option value="First Year">First Year</option>
                        <option value="Second Year">Second Year</option>
                        <option value="Third Year">Third Year</option>
                        <option value="Fourth Year">Fourth Year</option>
                    </select>
                    <span class="error-message" id="yearError"></span>
                </div>

                <!-- Department Selection -->
                <div class="form-group">
                    <label for="department">Department:</label>
                    <select id="department" required>
                        <option value="">-- Select Department --</option>
                        <option value="CSE">CSE (Computer Science & Engineering)</option>
                        <option value="IT">IT (Information Technology)</option>
                        <option value="ECE">ECE (Electronics & Communication)</option>
                        <option value="EEE">EEE (Electrical & Electronics)</option>
                        <option value="AI & DS">AI & DS (Artificial Intelligence & Data Science)</option>
                    </select>
                    <span class="error-message" id="departmentError"></span>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn-login">Login</button>
            </form>

            <!-- Info Message -->
            <p class="login-info">
                👋 New here? Start your learning journey by entering your details above!
            </p>
        </div>
    </div>

    <!-- Link to JavaScript -->
    <script src="login.js"></script>
</body>
</html>
